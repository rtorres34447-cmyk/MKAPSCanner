name: Build MKAfterpayScanner v2.9 APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'MKAfterpayScanner_v2.9_GitHub_Ready.zip'
      - '.github/workflows/main.yml'
      - '.github/workflows/build-apk.yml'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded project archive if present
        run: |
          if [ -f MKAfterpayScanner_v2.9_GitHub_Ready.zip ]; then
            unzip -o MKAfterpayScanner_v2.9_GitHub_Ready.zip -d .
          fi
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages (no obsolete tools package)
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MKAfterpayScanner-v2.9-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MKAfterpayScanner-v2.9-debug
          path: MKAfterpayScanner-v2.9-debug.apk
