name: Build MKAfterpayScanner APK v2.9

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'MKAfterpayScanner_v2.9_App_Only.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$REPOSITORY_NAME" != "MKAPSCanner" ]; then
            echo "This workflow is for MKAPSCanner, not $REPOSITORY_NAME"
            exit 1
          fi

      - name: Extract application ZIP
        run: |
          set -euo pipefail
          test -s MKAfterpayScanner_v2.9_App_Only.zip || { echo 'ZIP not found in repository root'; exit 1; }
          unzip -o MKAfterpayScanner_v2.9_App_Only.zip -d .

      - name: Verify scanner and app logo
        run: |
          set -euo pipefail
          for f in index.html manifest.webmanifest logo.png icons/icon-192.png icons/icon-512.png android/settings.gradle android/app/build.gradle android/app/src/main/AndroidManifest.xml; do
            test -s "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle app resources
        run: |
          mkdir -p android/app/src/main/assets/icons
          cp index.html android/app/src/main/assets/index.html
          cp manifest.webmanifest android/app/src/main/assets/manifest.webmanifest
          cp icons/icon-192.png android/app/src/main/assets/icons/icon-192.png
          cp icons/icon-512.png android/app/src/main/assets/icons/icon-512.png

      - name: Build APK
        run: gradle -p android --no-daemon assembleDebug

      - name: Name APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/debug/MKAfterpayScanner-v2.9-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKAfterpayScanner-v2.9-debug-apk
          path: android/app/build/outputs/apk/debug/MKAfterpayScanner-v2.9-debug.apk
          if-no-files-found: error
