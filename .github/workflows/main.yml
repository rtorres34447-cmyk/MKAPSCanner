name: Build MKAfterpayScanner APK v2.8

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "$REPOSITORY_NAME" != "MKAPSCanner" ]; then
            echo "ERROR: Wrong repository: $REPOSITORY_NAME"
            exit 1
          fi
          echo "Repository verified: $REPOSITORY_NAME"

      - name: Verify scanner and logo
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          test -s android/settings.gradle
          test -s android/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'platform-tools'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle scanner and icons
        run: |
          mkdir -p android/app/src/main/assets/icons

          cp index.html \
            android/app/src/main/assets/index.html

          cp manifest.webmanifest \
            android/app/src/main/assets/manifest.webmanifest

          cp icons/icon-192.png \
            android/app/src/main/assets/icons/icon-192.png

          cp icons/icon-512.png \
            android/app/src/main/assets/icons/icon-512.png

      - name: Build Android APK
        run: |
          gradle -p android --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mv \
            android/app/build/outputs/apk/debug/app-debug.apk \
            android/app/build/outputs/apk/debug/MKAfterpayScanner-v2.8-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKAfterpayScanner-v2.8-APK
          path: android/app/build/outputs/apk/debug/MKAfterpayScanner-v2.8-debug.apk
          if-no-files-found: error
