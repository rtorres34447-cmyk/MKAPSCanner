name: Build MKAfterpayScanner APK v3.3

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'MKAfterpayScanner-v3.3-GitHub-Upload.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check correct repository
        run: |
          test "${{ github.event.repository.name }}" = "MKAPSCanner"
      - name: Extract v3.3 source ZIP
        run: |
          set -euo pipefail
          test -s MKAfterpayScanner-v3.3-GitHub-Upload.zip
          unzip -o MKAfterpayScanner-v3.3-GitHub-Upload.zip -d .
          test -s index.html
          test -s android/app/src/main/java/com/mk/afterpayscanner/MainActivity.java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install original v3.3 HTML into APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/MKAfterpayScanner-v3.3-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MKAfterpayScanner-v3.3-debug-apk
          path: android/app/build/outputs/apk/debug/MKAfterpayScanner-v3.3-debug.apk
          if-no-files-found: error
