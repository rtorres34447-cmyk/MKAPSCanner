name: Build MKAfterpayScanner v2.9 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project ZIP if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle ]; then
            echo 'Android project already exists in the repository.'
          else
            echo 'Searching for MKAfterpayScanner project ZIP in the repository root...'
            ZIP_FILE="$(find . -maxdepth 1 -type f \( -iname '*MKAfterpayScanner*.zip' -o -iname '*MKAPScanner*.zip' \) -printf '%f\n' | sort -r | head -n 1)"
            if [ -z "$ZIP_FILE" ]; then
              echo 'ERROR: No app/build.gradle and no MKAfterpayScanner ZIP found at the repository root.'
              echo 'Upload MKAfterpayScanner_v2.9_Multiple_Dates_GitHub_Ready.zip to the root of the repository.'
              exit 1
            fi
            echo "Extracting $ZIP_FILE"
            unzip -oq "$ZIP_FILE" -d .
          fi
          test -f app/build.gradle || { echo 'ERROR: app/build.gradle is still missing'; exit 1; }
          test -f build.gradle || { echo 'ERROR: root build.gradle is missing'; exit 1; }
          test -f settings.gradle || { echo 'ERROR: settings.gradle is missing'; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo 'ERROR: AndroidManifest.xml is missing'; exit 1; }
          test -f app/src/main/assets/index.html || { echo 'ERROR: index.html is missing'; exit 1; }
          echo 'Project structure verified.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK dependencies
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKAfterpayScanner-v2.9-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
